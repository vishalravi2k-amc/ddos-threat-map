<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberScope | Live Global Threat &amp; DDoS Telemetry</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background: #030712; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; position: absolute; }
        
        /* Glassmorphism HUD */
        .hud-panel {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px);
            padding: 20px; border-radius: 12px; width: 340px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        h1 { margin: 0 0 5px 0; font-size: 20px; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        .subtitle { font-size: 12px; color: #94a3b8; margin-bottom: 15px; }
        .metric-box { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .card { background: rgba(30, 41, 59, 0.7); padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .card span { display: block; font-size: 11px; color: #94a3b8; text-transform: uppercase; }
        .card b { font-size: 16px; color: #f8fafc; }
        
        h3 { font-size: 13px; color: #cbd5e1; margin: 10px 0 8px 0; text-transform: uppercase; letter-spacing: 0.5px; }
        #logs { max-height: 220px; overflow-y: auto; padding-right: 4px; }
        #logs::-webkit-scrollbar { width: 4px; }
        #logs::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        .log-item { 
            font-size: 11px; margin-bottom: 6px; background: rgba(30, 41, 59, 0.4);
            padding: 8px; border-radius: 6px; border-left: 3px solid #ef4444;
            display: flex; justify-content: space-between; align-items: center;
        }
        .pulse-dot {
            height: 8px; width: 8px; background: #22c55e; border-radius: 50%; display: inline-block;
            box-shadow: 0 0 8px #22c55e; animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.8; } }
    </style>
</head>
<body>
    <div class="hud-panel">
        <h1><span class="pulse-dot"></span> CyberScope</h1>
        <div class="subtitle">Real-time Autonomous Threat Matrix</div>
        
        <div class="metric-box">
            <div class="card">
                <span>Total Attacks</span>
                <b id="total-count">0</b>
            </div>
            <div class="card">
                <span>Peak Volume</span>
                <b id="peak-gbps" style="color: #38bdf8;">0 Gbps</b>
            </div>
        </div>

        <h3>Live Interceptions</h3>
        <div id="logs"></div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { zoomControl: false, attributionControl: true }).setView([25, 0], 2);
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        // Auto-handle protocol for local vs production (WSS vs WS)
        const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        const ws = new WebSocket(protocol + window.location.host + '/ws/attacks');
        
        const logsDiv = document.getElementById('logs');
        let attackCount = 0;
        let peakGbps = 0;

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            attackCount++;
            if (data.gbps > peakGbps) peakGbps = data.gbps;

            document.getElementById('total-count').innerText = attackCount;
            document.getElementById('peak-gbps').innerText = peakGbps + " Gbps";

            // Target Pulse Circle
            const circle = L.circleMarker(data.target, {
                color: '#ef4444',
                radius: 7,
                weight: 2,
                fillColor: '#ef4444',
                fillOpacity: 0.6
            }).addTo(map);

            setTimeout(() => { map.removeLayer(circle); }, 2500);

            // Log Feed Entry
            const logItem = document.createElement('div');
            logItem.className = 'log-item';
            logItem.innerHTML = `
                <div>
                    <span style="color:#ef4444; font-weight:bold;">${data.type}</span><br>
                    <span style="color:#94a3b8">${data.origin_city} ➔ ${data.target_city}</span>
                </div>
                <b style="color:#38bdf8">${data.gbps} G</b>
            `;
            logsDiv.prepend(logItem);
            
            if (logsDiv.childElementCount > 12) {
                logsDiv.removeChild(logsDiv.lastChild);
            }
        };
    </script>
</body>
</html>
